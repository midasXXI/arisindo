<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Film</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { background: #0f172a; color: #f1f5f9; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
    .kartu { background: #1e293b; border-radius: 12px; overflow: hidden; transition: transform .2s; cursor: pointer; }
    .kartu:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(56,189,248,.25); }
    .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #334155; }
    .info { padding: 1rem; }
    .info h3 { font-size: 0.95rem; margin-bottom: 0.3rem; color: #e0f2fe; line-height: 1.3; }
    .info p { font-size: 0.8rem; color: #94a3b8; }
    .status { margin-top: 0.5rem; font-size: 0.75rem; }
    .ada { color: #4ade80; }
    .loading { text-align: center; padding: 4rem; color: #94a3b8; grid-column: 1 / -1; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h1>🎬 Koleksi Film</h1>
  <div id="gridFilm" class="grid"></div>

  <script>
    // === KONFIG — SUDAH DIPASTIKAN BENAR ===
    const API_KEY_ABYSS = "22eef122604d349b3de00257ae5ed34b";
    const API_KEY_TMDB = "c000d7b8b0f5ee16b98b6103009745d8";
    const TMDB_IMG_BASE = "https://image.tmdb.org/t/p/w342";

    // === AMBIL DAFTAR DARI ABYSS ===
    async function ambilDaftarAbyss() {
      const res = await fetch(`https://api.abyss.to/v1/resources?key=${API_KEY_ABYSS}`);
      if (!res.ok) throw new Error(`Abyss Error: ${res.status}`);
      const data = await res.json();
      const petaFilm = {};
      data.items.forEach(berkas => {
        const cocok = berkas.name.match(/^(\d+)\s+/);
        if (cocok) petaFilm[cocok[1]] = berkas;
      });
      return petaFilm;
    }

    // === AMBIL INFO DARI TMDB — DIPERBAIKI ===
    async function ambilInfoTMDB(tmdbId) {
      try {
        // Pakai cors-anywhere sebagai perantara untuk menghindari blokir
        const res = await fetch(
          `https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${API_KEY_TMDB}&language=id-ID`
        );
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      }
    }

    // === MULAI ===
    async function mulai() {
      const wadah = document.getElementById("gridFilm");
      wadah.innerHTML = `<p class="loading">🔄 Memuat daftar film...</p>`;

      try {
        const petaAbyss = await ambilDaftarAbyss();
        const daftarId = Object.keys(petaAbyss);

        if (!daftarId.length) {
          wadah.innerHTML = `<p class="loading">Belum ada berkas dengan format ID TMDB</p>`;
          return;
        }

        wadah.innerHTML = "";

        // Muat satu per satu biar gak berat
        for (const tmdbId of daftarId) {
          const berkas = petaAbyss[tmdbId];
          const film = await ambilInfoTMDB(tmdbId);

          const kartu = document.createElement("div");
          kartu.className = "kartu";
          kartu.onclick = () => {
            window.location.href = `watch.html?tmdb=${tmdbId}&file=${berkas.id}&judul=${encodeURIComponent(film?.title || berkas.name)}`;
          };

          kartu.innerHTML = `
            <img 
              src="${film ? TMDB_IMG_BASE + film.poster_path : ''}" 
              alt="${film?.title || berkas.name}"
              class="poster"
              loading="lazy"
              onerror="this.src='https://via.placeholder.com/300x450/1e293b/94a3b8?text=${encodeURIComponent('Film+' + tmdbId)}'"
            >
            <div class="info">
              <h3>${film?.title || berkas.name.replace(/^\d+\s*/, "")}</h3>
              <p>${film?.release_date?.slice(0,4) || "-"} • ${(berkas.size/1024**3).toFixed(2)} GB</p>
              <div class="status ada">✅ Tersedia di Abyss</div>
            </div>
          `;
          wadah.appendChild(kartu);
        }
      } catch (err) {
        wadah.innerHTML = `<p class="loading error">❌ Gagal muat: ${err.message}<br>Periksa apakah internet & API Abyss bisa diakses</p>`;
      }
    }

    mulai();
  </script>
</body>
</html>
