<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Film</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { background: #030712; color: #f8fafc; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
    .kartu { border-radius: 12px; overflow: hidden; background: #0f172a; transition: transform .2s; cursor: pointer; border: 1px solid #1e293b; }
    .kartu:hover { transform: translateY(-5px); border-color: #38bdf8; }
    .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1e293b; }
    .info { padding: 1rem; }
    .info h3 { font-size: .9rem; margin-bottom: .3rem; line-height: 1.3; }
    .info p { font-size: .8rem; color: #94a3b8; }
    .status { margin-top: .5rem; font-size: .75rem; color: #4ade80; }
    .loading { text-align: center; padding: 4rem; color: #94a3b8; grid-column: 1 / -1; }
  </style>
</head>
<body>
  <h1>🎬 Koleksi Film</h1>
  <div class="grid" id="grid"></div>

  <script>
    const API_KEY_TMDB = "c000d7b8b0f5ee16b98b6103009745d8";
    const IMG_BASE = "https://image.tmdb.org/t/p/w342";

    // === DAFTAR BERKAS DARI ABYSS — SESUAI GAMBAR KAMU ===
    // Format: tmdbId, nama berkas, id berkas di Abyss
    const DAFTAR_BERKAS = [
      { tmdbId: "977942", nama: "The Uprising 2026.mp4", fileId: "ASdYY4dz-" },
      { tmdbId: "282035", nama: "The Mummy 2017.mp4", fileId: "oHdbeTDe" },
      { tmdbId: "1320330", nama: "Year 10 2024.mp4", fileId: "hCjFqsTIn7" }
      // Tambah film baru di sini: { tmdbId: "xxx", nama: "Judul.mp4", fileId: "kode" }
    ];

    async function muatSemua() {
      const wadah = document.getElementById("grid");
      wadah.innerHTML = `<p class="loading">🔄 Memuat poster...</p>`;
      wadah.innerHTML = "";

      for (const berkas of DAFTAR_BERKAS) {
        try {
          const res = await fetch(
            `https://api.themoviedb.org/3/movie/${berkas.tmdbId}?api_key=${API_KEY_TMDB}&language=id-ID`
          );
          if (!res.ok) continue;
          const film = await res.json();

          wadah.innerHTML += `
            <div class="kartu" onclick="bukaFilm('${berkas.tmdbId}','${berkas.fileId}','${encodeURIComponent(film.title)}')">
              <img 
                src="${IMG_BASE}${film.poster_path}" 
                alt="${film.title}" 
                class="poster"
                loading="lazy"
              >
              <div class="info">
                <h3>${film.title}</h3>
                <p>${film.release_date?.slice(0,4) || "-"}</p>
                <p class="status">✅ Tersedia di Abyss</p>
              </div>
            </div>
          `;
        } catch (e) {
          console.log(berkas.tmdbId, e);
        }
      }
    }

    function bukaFilm(tmdbId, fileId, judul) {
      window.location.href = `watch.html?tmdb=${tmdbId}&file=${fileId}&judul=${judul}`;
    }

    muatSemua();
  </script>
</body>
</html>
