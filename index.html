<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Film</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { background: #030712; color: #f8fafc; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
    .kartu { border-radius: 12px; overflow: hidden; background: #0f172a; transition: transform .2s; cursor: pointer; border: 1px solid #1e293b; }
    .kartu:hover { transform: translateY(-5px); border-color: #38bdf8; }
    .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1e293b; }
    .info { padding: 1rem; }
    .info h3 { font-size: .9rem; margin-bottom: .3rem; line-height: 1.3; }
    .info p { font-size: .8rem; color: #94a3b8; }
    .status { margin-top: .5rem; font-size: .75rem; color: #4ade80; }
    .loading { text-align: center; padding: 4rem; color: #94a3b8; grid-column: 1 / -1; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h1>🎬 Koleksi Film</h1>
  <div class="grid" id="grid"></div>

  <script>
    const API_KEY_TMDB = "c000d7b8b0f5ee16b98b6103009745d8";
    const API_KEY_ABYSS = "22eef122604d349b3de00257ae5ed34b";
    const IMG_BASE = "https://image.tmdb.org/t/p/w342";
    const CORS_PROXY = "https://corsproxy.io/?";

    // Ambil semua berkas dari Abyss — TANPA DAFTAR MANUAL
    async function ambilDariAbyss() {
      const url = `${CORS_PROXY}${encodeURIComponent(`https://api.abyss.to/v1/resources?key=${API_KEY_ABYSS}`)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Abyss: ${res.status}`);
      const data = await res.json();
      return data.items || [];
    }

    // Ambil ID TMDB dari nama berkas
    function ambilId(nama) {
      const cocok = nama.match(/^(\d+)\s+/);
      return cocok ? cocok[1] : null;
    }

    // Ambil info dari TMDB
    async function ambilTMDB(tmdbId) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${API_KEY_TMDB}&language=id-ID`);
        return res.ok ? await res.json() : null;
      } catch { return null; }
    }

    async function mulai() {
      const wadah = document.getElementById("grid");
      wadah.innerHTML = `<p class="loading">🔄 Memuat dari Abyss...</p>`;

      try {
        const berkasList = await ambilDariAbyss();
        wadah.innerHTML = "";

        if (!berkasList.length) {
          wadah.innerHTML = `<p class="loading">Tidak ada berkas</p>`;
          return;
        }

        for (const berkas of berkasList) {
          const tmdbId = ambilId(berkas.name);
          if (!tmdbId) continue;

          const film = await ambilTMDB(tmdbId);
          
          if (film) {
            wadah.innerHTML += `
              <div class="kartu" onclick="buka('${tmdbId}','${berkas.id}','${encodeURIComponent(film.title)}')">
                <img src="${IMG_BASE}${film.poster_path}" alt="${film.title}" class="poster" loading="lazy">
                <div class="info">
                  <h3>${film.title}</h3>
                  <p>${film.release_date?.slice(0,4) || "-"} • ${(berkas.size/1024**3).toFixed(2)} GB</p>
                  <p class="status">✅ Tersedia</p>
                </div>
              </div>
            `;
          }
        }
      } catch (err) {
        wadah.innerHTML = `<p class="loading error">❌ ${err.message}<br>Buka berkas langsung di komputer kalau GitHub diblokir</p>`;
      }
    }

    function buka(tmdbId, fileId, judul) {
      window.location.href = `watch.html?tmdb=${tmdbId}&file=${fileId}&judul=${judul}`;
    }

    mulai();
  </script>
</body>
</html>
