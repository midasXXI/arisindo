<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Film — TMDB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { background: #030712; color: #f8fafc; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 2rem; font-size: 1.8rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.8rem; }
    .kartu { background: #0f172a; border-radius: 12px; overflow: hidden; transition: all .25s ease; cursor: pointer; border: 1px solid #1e293b; }
    .kartu:hover { transform: translateY(-6px); border-color: #38bdf8; box-shadow: 0 12px 30px rgba(56,189,248,.15); }
    .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1e293b; }
    .info { padding: 1rem; }
    .info h3 { font-size: .95rem; margin-bottom: .4rem; color: #f0f9ff; line-height: 1.4; }
    .info p { font-size: .8rem; color: #94a3b8; }
    .skor { display: inline-flex; align-items: center; gap: .3rem; background: #1e293b; padding: .2rem .5rem; border-radius: 20px; font-size: .75rem; margin-top: .5rem; }
    .bintang { color: #facc15; }
    .loading { text-align: center; padding: 5rem 2rem; color: #94a3b8; grid-column: 1 / -1; }
    .error { color: #f87171; }
    .kosong { color: #64748b; text-align: center; padding: 3rem; grid-column: 1 / -1; }
  </style>
</head>
<body>
  <h1>🎬 Koleksi Film — TMDB</h1>
  <div id="gridFilm" class="grid"></div>

  <script>
    // === KUNCI TMDB KAMU SUDAH BENAR ===
    const API_KEY_TMDB = "c000d7b8b0f5ee16b98b6103009745d8";
    const TMDB_IMG = "https://image.tmdb.org/t/p/w342";

    // Daftar ID TMDB dari film kamu — sesuaikan nanti
    const DAFTAR_ID = [
      "977942",   // The Uprising 2026
      "282035",   // The Mummy 2017
      "1320330"   // Year 10 2024
      // Tambah ID lain di sini
    ];

    // === AMBIL INFO FILM DARI TMDB ===
    async function ambilFilm(tmdbId) {
      try {
        const res = await fetch(
          `https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${API_KEY_TMDB}&language=id-ID`
        );
        if (!res.ok) return null;
        return await res.json();
      } catch (err) {
        console.log(`Gagal ambil ID ${tmdbId}:`, err);
        return null;
      }
    }

    // === TAMPILKAN SEMUA FILM ===
    async function mulai() {
      const wadah = document.getElementById("gridFilm");
      wadah.innerHTML = `<p class="loading">🔄 Memuat daftar film dari TMDB...</p>`;

      const daftarKartu = [];

      for (const id of DAFTAR_ID) {
        const film = await ambilFilm(id);
        
        if (!film) {
          daftarKartu.push(`
            <div class="kartu">
              <div style="width:100%;aspect-ratio:2/3;background:#1e293b;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:.8rem;text-align:center;padding:1rem;">
                ID ${id}<br>Tidak ditemukan
              </div>
              <div class="info">
                <h3>ID: ${id}</h3>
                <p>Data tidak ditemukan</p>
              </div>
            </div>
          `);
          continue;
        }

        daftarKartu.push(`
          <div class="kartu" onclick="klikFilm('${id}')">
            <img 
              src="${TMDB_IMG}${film.poster_path}" 
              alt="${film.title}"
              class="poster"
              loading="lazy"
              onerror="this.src='https://via.placeholder.com/300x450/0f172a/475569?text=${encodeURIComponent(film.title)}'"
            >
            <div class="info">
              <h3>${film.title}</h3>
              <p>${film.release_date ? film.release_date.slice(0,4) : "-"} • ${film.runtime} menit</p>
              <div class="skor">
                <span class="bintang">★</span>
                ${film.vote_average?.toFixed(1) || "0.0"}
              </div>
            </div>
          </div>
        `);
      }

      wadah.innerHTML = daftarKartu.join("");
    }

    // Saat diklik — nanti dihubungkan ke watch.html
    function klikFilm(tmdbId) {
      alert(`Klik film ID: ${tmdbId}\nNanti akan dihubungkan ke watch.html`);
      // window.location.href = `watch.html?tmdb=${tmdbId}`;
    }

    // Jalankan
    mulai();
  </script>
</body>
</html>
