<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Film — TMDB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { background: #030712; color: #f8fafc; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
    .kartu { border-radius: 12px; overflow: hidden; background: #0f172a; }
    .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .info { padding: 1rem; }
    .info h3 { font-size: 0.9rem; margin-bottom: 0.3rem; }
    .info p { font-size: 0.8rem; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>🎬 Koleksi Film</h1>
  <div class="grid" id="grid"></div>

  <script>
    const API_KEY = "c000d7b8b0f5ee16b98b6103009745d8";
    const IMG_BASE = "https://image.tmdb.org/t/p/w342";

    // Daftar ID film kamu
    const daftar = ["977942", "282035", "1320330"];

    async function muat() {
      const wadah = document.getElementById("grid");
      
      for (const id of daftar) {
        try {
          const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=id-ID`);
          if (!res.ok) continue;
          const film = await res.json();
          
          wadah.innerHTML += `
            <div class="kartu">
              <img src="${IMG_BASE}${film.poster_path}" alt="${film.title}" class="poster">
              <div class="info">
                <h3>${film.title}</h3>
                <p>${film.release_date?.slice(0,4) || "-"}</p>
              </div>
            </div>
          `;
        } catch (e) {
          console.log(id, e);
        }
      }
    }

    muat();
  </script>
</body>
</html>
