<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menonton</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { background: #030712; color: #f8fafc; min-height: 100vh; padding: 2rem; }
    .wadah { max-width: 1000px; margin: 0 auto; }
    .kembali { display: inline-block; color: #38bdf8; text-decoration: none; margin-bottom: 1.5rem; }
    h1 { margin-bottom: 1rem; font-size: 1.4rem; }
    .status { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; }
    .dari-abyss { background: #164e63; }
    .dari-cadangan { background: #4c1d95; }
    .pemutar { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
    .pemutar iframe { width: 100%; height: 100%; border: none; }
    .info-abu { color: #94a3b8; margin-bottom: 1rem; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="wadah">
    <a href="index.html" class="kembali">← Kembali</a>
    <h1 id="judul">Memuat...</h1>
    <p class="info-abu" id="cek">🔄 Mengecek...</p>
    <div class="pemutar" id="kotak"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const tmdbId = params.get("tmdb");
    const fileId = params.get("file");
    const judul = decodeURIComponent(params.get("judul") || "Film");

    document.title = `Tonton — ${judul}`;
    document.getElementById("judul").textContent = judul;

    const API_KEY_ABYSS = "22eef122604d349b3de00257ae5ed34b";
    const CORS_PROXY = "https://corsproxy.io/?";

    async function mulai() {
      const cek = document.getElementById("cek");
      const kotak = document.getElementById("kotak");

      // Cek langsung ke Abyss pakai fileId dari URL
      try {
        const urlCek = `${CORS_PROXY}${encodeURIComponent(`https://api.abyss.to/v1/files/${fileId}?key=${API_KEY_ABYSS}`)}`;
        const res = await fetch(urlCek);
        
        if (res.ok) {
          cek.innerHTML = `✅ Cocok — Ada di Abyss (ID: ${tmdbId})`;
          kotak.innerHTML = `
            <div class="status dari-abyss">🎞️ Sumber: Abyss.to</div>
            <iframe src="https://vsembed.ru/embed/${tmdbId}" allowfullscreen allow="autoplay; fullscreen"></iframe>
          `;
          return;
        }
      } catch (e) {
        console.log("Abyss gagal:", e);
      }

      // Gagal → langsung vsembed.ru
      cek.innerHTML = `⚠️ Tidak di Abyss → Pakai vsembed.ru (ID: ${tmdbId})`;
      kotak.innerHTML = `
        <div class="status dari-cadangan">🌐 Sumber: vsembed.ru</div>
        <iframe src="https://vsembed.ru/embed/${tmdbId}" allowfullscreen allow="autoplay; fullscreen"></iframe>
      `;

      // Ganti ke .su kalau .ru gagal
      setTimeout(() => {
        kotak.innerHTML = `
          <div class="status dari-cadangan">🌐 Beralih ke vsembed.su</div>
          <iframe src="https://vsembed.su/embed/${tmdbId}" allowfullscreen allow="autoplay; fullscreen"></iframe>
        `;
      }, 12000);
    }

    mulai();
  </script>
</body>
</html>
