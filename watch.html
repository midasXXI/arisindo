<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menonton — </title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body { background: #0f172a; color: #f1f5f9; min-height: 100vh; padding: 2rem; }
    .wadah { max-width: 1000px; margin: 0 auto; }
    .kembali { display: inline-block; color: #38bdf8; text-decoration: none; margin-bottom: 1.5rem; }
    .kembali:hover { text-decoration: underline; }
    h1 { color: #e0f2fe; margin-bottom: 1.5rem; font-size: 1.4rem; }
    .pemutar { width: 100%; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; aspect-ratio: 16/9; }
    .pemutar video, .pemutar iframe { width: 100%; height: 100%; border: none; }
    .info-sumber { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .sumber-abyss { background: #164e63; }
    .sumber-vsembed { background: #4c1d95; }
    .cek { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1rem; }
    .gagal { color: #f87171; }
    .berhasil { color: #4ade80; }
  </style>
</head>
<body>
  <div class="wadah">
    <a href="index.html" class="kembali">← Kembali ke Daftar</a>
    <h1 id="judulFilm">Memuat...</h1>
    <div class="cek" id="statusCek">🔄 Mengecek ketersediaan di Abyss...</div>
    <div class="pemutar" id="kotakPemutar"></div>
  </div>

  <script>
    // === AMBIL PARAMETER DARI URL ===
    const params = new URLSearchParams(window.location.search);
    const tmdbId = params.get("tmdb");
    const fileId = params.get("file");
    const judulDekode = decodeURIComponent(params.get("judul") || "Film");

    document.title = `Menonton — ${judulDekode}`;
    document.getElementById("judulFilm").textContent = judulDekode;

    // === KONFIG ===
    const API_KEY_ABYSS = "22eef122604d349b3de00257ae5ed34b";
    const ABYSS_PLAY_URL = `https://api.abyss.to/v1/files/${fileId}/play`;
    const VSEMBD_URL1 = `https://vsembed.ru/embed/${tmdbId}`;
    const VSEMBD_URL2 = `https://vsembed.su/embed/${tmdbId}`;

    // === CEK & TAMPILKAN ===
    async function cekDanMain() {
      const status = document.getElementById("statusCek");
      const kotak = document.getElementById("kotakPemutar");

      // Langkah 1: Cek apakah berkas masih ada di Abyss
      try {
        const res = await fetch(`https://api.abyss.to/v1/files/${fileId}?key=${API_KEY_ABYSS}`);
        if (res.ok) {
          // ✅ ADA — main pakai Abyss
          status.innerHTML = `<span class="berhasil">✅ Ditemukan di Abyss — memutar dari server lokal</span>`;
          kotak.innerHTML = `
            <div class="info-sumber sumber-abyss">
              🎞️ Sumber: Abyss.to • ID Berkas: ${fileId}
            </div>
            <video controls autoplay>
              <source src="${ABYSS_PLAY_URL}" type="video/mp4">
              Peramban Anda tidak mendukung pemutaran video.
            </video>
          `;
          return;
        }
      } catch (err) {
        console.log("Cek Abyss gagal:", err);
      }

      // ❌ TIDAK ADA — ganti ke vsembed
      status.innerHTML = `<span class="gagal">❌ Tidak ditemukan di Abyss → beralih ke server alternatif</span>`;
      
      // Coba vsembed.ru dulu
      kotak.innerHTML = `
        <div class="info-sumber sumber-vsembed">
          🌐 Sumber: vsembed.ru • ID TMDB: ${tmdbId}
        </div>
        <iframe src="${VSEMBD_URL1}" allowfullscreen allow="autoplay; fullscreen"></iframe>
      `;

      // Opsional: Ganti ke .su kalau .ru gagal (bisa ditambahkan deteksi otomatis)
    }

    cekDanMain();
  </script>
</body>
</html>
